<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oitree</title>

  <!-- ========== 模块化样式（按级联顺序加载） ========== -->
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/sidebar.css" />
  <link rel="stylesheet" href="./css/canvas.css" />
  <link rel="stylesheet" href="./css/modal.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <header class="sidebar-header">
        <span class="brand">oitree</span>
      </header>
      <div class="sidebar-label">
        <span>题库分类</span>
        <span class="sidebar-label-hint">拖拽排序 · 双击进入设置</span>
      </div>
      <ul class="category-list" id="category-list" role="tablist"></ul>
      <footer class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block" id="add-category">＋ 新增分类</button>
        <button type="button" class="btn btn-ghost btn-block" id="import-category">⇩ 导入目录 (.oitree)</button>
        <input type="file" id="import-input" accept=".oitree,.json,application/json" hidden />
      </footer>
    </div>
  </aside>

  <div class="main">
    <header class="toolbar">
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="展开 / 收起分类栏" aria-label="切换分类栏">☰</button>

      <div class="toolbar-search">
        <span class="toolbar-search-icon" aria-hidden="true">🔍</span>
        <input id="search-input" class="toolbar-search-input" type="text" autocomplete="off" spellcheck="false" placeholder="搜索题目/知识点 (Ctrl+K)..." aria-label="搜索题目或知识点" />
        <button type="button" class="toolbar-search-clear" id="search-clear" title="清空搜索 (Esc)" aria-label="清空搜索" hidden>×</button>
      </div>

      <select class="toolbar-filter-select" id="difficulty-filter" title="按难度筛选" aria-label="按难度筛选"></select>

      <div class="toolbar-actions">
        <button id="add-node" type="button" class="btn btn-primary">＋ 增加题目</button>
        <button id="auto-layout" type="button" class="btn btn-ghost">⇅ 一键整理布局</button>
        <button id="reset-view" type="button" class="btn btn-ghost">⌖ 重置视图</button>
      </div>

      <button type="button" class="drawer-toggle" id="drawer-toggle" title="题目列表" aria-label="打开题目列表">
        <span aria-hidden="true">📋</span>
      </button>
    </header>

    <main id="canvas" class="canvas" aria-label="节点画布">
      <div class="canvas-info" id="canvas-info" hidden>
        <button type="button" class="canvas-info-header" id="canvas-info-header" aria-expanded="false" aria-controls="canvas-info-detail">
          <span class="canvas-info-icon" id="canvas-info-icon">👤</span>
          <span class="canvas-info-header-text" id="canvas-info-header-text">作者</span>
          <span class="canvas-info-chevron" id="canvas-info-chevron">▾</span>
        </button>
        <div class="canvas-info-detail" id="canvas-info-detail" hidden>
          <div class="canvas-info-line" id="canvas-info-author-line">
            <span class="canvas-info-key">作者</span>
            <a class="canvas-info-author" id="canvas-info-author" target="_blank" rel="noopener noreferrer">—</a>
            <span class="canvas-info-dot" id="canvas-info-luogu-dot" hidden>·</span>
            <a class="canvas-info-luogu" id="canvas-info-luogu" target="_blank" rel="noopener noreferrer" hidden>洛谷主页 ↗</a>
          </div>
          <div class="canvas-info-line" id="canvas-info-desc-row" hidden>
            <button type="button" class="canvas-info-toggle" id="canvas-info-toggle">
              <span class="canvas-info-toggle-icon" id="canvas-info-toggle-icon">▾</span>
              <span id="canvas-info-toggle-text">查看简介</span>
            </button>
          </div>
          <div class="canvas-info-desc" id="canvas-info-desc" hidden></div>
        </div>
      </div>

      <svg id="links" class="links" aria-hidden="true">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M0,0.6 L10,5 L0,9.4 Z" fill="#5aa0ff"></path>
          </marker>
          <marker id="arrow-preview" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M0,0.6 L10,5 L0,9.4 Z" fill="#7dd3fc"></path>
          </marker>
        </defs>
        <g id="links-layer"></g>
        <g id="preview-layer"></g>
      </svg>

      <div id="world" class="world"></div>

      <div class="zoom-badge" id="zoom-badge" title="点击重置为 100%">
        <span id="zoom-value">100%</span>
      </div>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="题目清单">
    <header class="drawer-header">
      <div class="drawer-title">
        <h2 id="drawer-category-name">—</h2>
        <span class="drawer-count" id="drawer-count">0 道题</span>
      </div>
      <button type="button" class="drawer-close" id="drawer-close" aria-label="关闭">×</button>
    </header>
    <div class="drawer-toolbar">
      <span class="drawer-sort-label">排序</span>
      <select class="drawer-sort-select" id="drawer-sort-select">
        <option value="completed">按完成时间</option>
        <option value="created">按加入时间</option>
        <option value="title">按字典序</option>
      </select>
    </div>
    <ul class="drawer-list" id="drawer-list"></ul>
  </aside>

  <!-- ========== 题目编辑表单弹窗 ========== -->
  <div class="modal-backdrop" id="modal" hidden>
    <form class="modal" id="problem-form" novalidate>
      <header class="modal-header">
        <div class="modal-header-left">
          <h2 id="modal-title">增加题目</h2>
          <span class="create-time" id="modal-create-time"></span>
        </div>
        <button type="button" class="modal-close" id="modal-close" aria-label="关闭">×</button>
      </header>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">题目名称</span>
          <input id="field-title" name="title" type="text" autocomplete="off" placeholder="例如：P3374 【模板】树状数组 1" />
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">题目难度</span>
            <select id="field-difficulty" name="difficulty"></select>
          </label>
          <label class="field">
            <span class="field-label">算法知识点</span>
            <input id="field-tags" name="tags" type="text" autocomplete="off" placeholder="树状数组、前缀和、差分" />
          </label>
        </div>

        <div class="field field-status">
          <span class="field-label">刷题状态</span>
          <div class="status-btn-group" id="field-status-seg" role="radiogroup" aria-label="刷题状态">
            <button type="button" class="status-btn" data-status="none">⚪ 暂无</button>
            <button type="button" class="status-btn" data-status="ac">🟢 独立 AC</button>
            <button type="button" class="status-btn" data-status="hint">🟡 看题解</button>
            <button type="button" class="status-btn" data-status="fail">🔴 未攻克</button>
          </div>
          <input type="hidden" id="field-status" name="status" value="ac" />
        </div>

        <div class="field-row">
          <label class="field">
            <span class="field-label">题目链接</span>
            <input id="field-link" name="link" type="text" inputmode="url" autocomplete="off" placeholder="https://www.luogu.com.cn/problem/P3374" />
          </label>
          <label class="field">
            <span class="field-label">完成时间（AC 日期）</span>
            <input id="field-completed" name="completedAt" type="date" />
          </label>
        </div>

        <div class="field field-note">
          <div class="field-note-header">
            <span class="field-label">复盘批注 / 解题思路</span>
            <div class="field-note-actions">
              <button type="button" class="expand-note-btn" id="note-expand-btn" title="展开大窗口编辑">⛶ 大窗口</button>
              <div class="note-tabs" role="tablist" aria-label="编辑 / 预览切换">
                <button type="button" class="note-tab is-active" id="note-tab-edit" data-tab="edit" role="tab" aria-selected="true">✏️ 编辑</button>
                <button type="button" class="note-tab" id="note-tab-preview" data-tab="preview" role="tab" aria-selected="false">👁️ 预览</button>
              </div>
            </div>
          </div>
          <textarea id="field-note" name="note" rows="10" placeholder="支持 Markdown 与 LaTeX 公式"></textarea>
          <div class="markdown-preview" id="note-preview" hidden></div>
        </div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-danger" id="modal-delete" hidden>🗑 删除题目</button>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-ghost" id="modal-cancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </footer>
    </form>
  </div>

  <!-- ========== 分类信息编辑弹窗 ========== -->
  <div class="modal-backdrop" id="cat-modal" hidden>
    <form class="modal modal-cat" id="cat-form" novalidate>
      <header class="modal-header">
        <div class="modal-header-left">
          <h2 id="cat-modal-title">编辑目录信息</h2>
        </div>
        <button type="button" class="modal-close" id="cat-modal-close" aria-label="关闭">×</button>
      </header>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">分类名称</span>
          <input id="cat-field-name" type="text" maxlength="24" autocomplete="off" placeholder="例如：图论进阶" />
        </label>
        <label class="field">
          <span class="field-label">创建者</span>
          <input id="cat-field-author" type="text" maxlength="40" autocomplete="off" placeholder="出题人 / 作者昵称" />
        </label>
        <label class="field">
          <span class="field-label">创建者洛谷网址</span>
          <input id="cat-field-luogu" type="text" inputmode="url" autocomplete="off" placeholder="https://www.luogu.com.cn/user/..." />
        </label>
        <div class="field field-note">
          <div class="field-note-header">
            <span class="field-label">大目录简介</span>
            <div class="field-note-actions">
              <button type="button" class="expand-note-btn" id="cat-desc-expand-btn" title="展开大窗口编辑">⛶ 大窗口</button>
              <div class="note-tabs" role="tablist" aria-label="编辑 / 预览切换">
                <button type="button" class="note-tab is-active" id="cat-desc-tab-edit" role="tab" aria-selected="true">✏️ 编辑</button>
                <button type="button" class="note-tab" id="cat-desc-tab-preview" role="tab" aria-selected="false">👁️ 预览</button>
              </div>
            </div>
          </div>
          <textarea id="cat-field-desc" rows="8" placeholder="支持 Markdown 与 LaTeX 公式"></textarea>
          <div class="markdown-preview" id="cat-desc-preview" hidden></div>
        </div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-danger" id="cat-modal-delete" hidden>🗑 删除此分类</button>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-ghost" id="cat-modal-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="cat-modal-submit">保存</button>
        </div>
      </footer>
    </form>
  </div>

  <!-- ========== 沉浸式大编辑器（Zen Mode） ========== -->
  <div class="modal-backdrop zen-backdrop" id="zen-modal" hidden>
    <div class="zen-container" role="dialog" aria-modal="true" aria-label="沉浸式大编辑器">
      <header class="zen-header">
        <div class="zen-header-left">
          <h2 class="zen-title" id="zen-title">沉浸式编辑</h2>
          <span class="zen-subtitle" id="zen-subtitle">支持 Markdown、LaTeX 公式与代码高亮</span>
        </div>
        <button type="button" class="modal-close" id="zen-close" aria-label="关闭">×</button>
      </header>
      <div class="zen-body">
        <div class="zen-pane zen-pane-edit">
          <textarea id="zen-input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="支持 Markdown 与 LaTeX 公式..."></textarea>
        </div>
        <div class="zen-pane zen-pane-preview">
          <div class="markdown-preview zen-preview" id="zen-preview"></div>
        </div>
      </div>
      <footer class="zen-footer">
        <div class="zen-footer-right">
          <button type="button" class="btn btn-primary" id="zen-save">保存并返回</button>
        </div>
      </footer>
    </div>
  </div>

  <!-- ========== 📖 题解阅读视图（Reader View） ========== -->
  <div class="modal-backdrop reader-backdrop" id="reader-modal" hidden>
    <div class="reader" role="dialog" aria-modal="true" aria-label="题目详情与题解阅读">
      <header class="reader-header">
        <div class="reader-header-main">
          <h2 class="reader-title" id="reader-title">—</h2>
          <div class="reader-meta">
            <span class="reader-difficulty" id="reader-difficulty">暂无评定</span>
            <span class="reader-status" id="reader-status" hidden></span>
            <span class="reader-tags" id="reader-tags"></span>
          </div>
          <div class="reader-times" id="reader-times">
            <span id="reader-created"></span>
            <span id="reader-completed"></span>
          </div>
        </div>
        <div class="reader-header-actions">
          <button type="button" class="btn btn-ghost reader-edit-btn" id="reader-edit" title="打开编辑表单">✏️ 编辑此题</button>
          <button type="button" class="modal-close" id="reader-close" aria-label="关闭">×</button>
        </div>
      </header>
      <div class="markdown-preview reader-body" id="reader-body"></div>
    </div>
  </div>

  <!-- ========== 外部 CDN 库 ========== -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- ========== 本地工程脚本（按依赖顺序 defer 加载） ========== -->
  <script defer src="./js/state.js"></script>
  <script defer src="./js/canvas.js"></script>
  <script defer src="./js/editor.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
